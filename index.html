<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高中英语语法切片课堂</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f0f4f8;color:#1a2233;min-height:100vh}

  /* ── 顶栏 ── */
  header{background:#1a3a6b;color:#fff;padding:20px 32px 16px}
  header h1{font-size:22px;font-weight:700;letter-spacing:.5px}
  header p{margin-top:4px;font-size:13px;opacity:.75}

  /* ── 进度总览 ── */
  .progress-bar-wrap{background:#fff;border-bottom:1px solid #dde3ef;padding:14px 32px}
  .prog-row{display:flex;gap:20px;flex-wrap:wrap}
  .prog-item{flex:1;min-width:160px}
  .prog-label{font-size:12px;color:#5a6a88;margin-bottom:5px}
  .prog-track{height:7px;background:#e4eaf5;border-radius:4px;overflow:hidden}
  .prog-fill{height:100%;border-radius:4px;transition:width .4s}
  .prog-count{font-size:11px;color:#8a97b0;margin-top:3px}

  /* ── 主体 ── */
  .main{display:flex;min-height:calc(100vh - 110px)}

  /* ── 左侧 Tab ── */
  .sidebar{width:200px;background:#fff;border-right:1px solid #dde3ef;padding:12px 0;flex-shrink:0}
  .tab-btn{display:block;width:100%;text-align:left;padding:11px 20px;border:none;background:none;cursor:pointer;font-size:13.5px;color:#3a4a66;border-left:3px solid transparent;transition:all .15s}
  .tab-btn:hover{background:#f0f4f8;color:#1a3a6b}
  .tab-btn.active{background:#eef3fb;color:#1a3a6b;border-left-color:#1a3a6b;font-weight:600}
  .tab-badge{float:right;font-size:11px;background:#e4eaf5;border-radius:8px;padding:1px 7px;color:#5a6a88}

  /* ── 右侧内容 ── */
  .content{flex:1;padding:24px 32px;overflow-y:auto}
  .level-panel{display:none}
  .level-panel.active{display:block}

  .level-head{margin-bottom:20px}
  .level-head h2{font-size:18px;color:#1a3a6b}
  .level-head p{font-size:13px;color:#5a6a88;margin-top:4px}

  /* ── 资料下载 ── */
  .dl-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
  .dl-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:6px;text-decoration:none;font-size:13px;font-weight:500;transition:opacity .15s}
  .dl-btn:hover{opacity:.8}
  .dl-btn.outline{border:1.5px solid #1a3a6b;color:#1a3a6b;background:#fff}
  .dl-btn.solid{background:#1a3a6b;color:#fff}
  .dl-icon{font-size:15px}

  /* ── 模块分组 ── */
  .mod-group{margin-bottom:28px}
  .mod-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #e4eaf5}
  .mod-tag{font-size:11px;background:#e8edf8;color:#3a5a9b;border-radius:4px;padding:2px 8px;font-weight:600}
  .mod-name{font-size:14px;font-weight:700;color:#1a2233}

  /* ── 课程卡片网格 ── */
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .card{background:#fff;border:1.5px solid #dde3ef;border-radius:8px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;transition:box-shadow .15s,border-color .15s;cursor:default}
  .card:hover{box-shadow:0 4px 12px rgba(26,58,107,.1);border-color:#b0c4e8}
  .card.done{border-color:#1a3a6b;background:#f5f8ff}
  .card-no{font-size:11px;font-weight:700;color:#8a97b0;min-width:28px;padding-top:2px}
  .card.done .card-no{color:#1a3a6b}
  .card-body{flex:1}
  .card-title{font-size:13.5px;line-height:1.45;color:#1a2233}
  .card.done .card-title{color:#1a3a6b;font-weight:600}
  .card-meta{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:10.5px;padding:1px 7px;border-radius:10px;background:#f0f4f8;color:#5a6a88}
  .chip.done-chip{background:#d6e4ff;color:#1a3a6b}
  .dl-chip{font-size:10.5px;padding:1px 8px;border-radius:10px;background:#1a3a6b;color:#fff;text-decoration:none;display:inline-block}
  .dl-chip:hover{background:#2a5aab}

  @media(max-width:640px){
    .sidebar{width:100%;border-right:none;border-bottom:1px solid #dde3ef;display:flex;flex-wrap:wrap;padding:6px}
    .tab-btn{width:auto;flex:1;min-width:100px;border-left:none;border-bottom:3px solid transparent;padding:8px 12px;font-size:12px}
    .tab-btn.active{border-bottom-color:#1a3a6b;border-left-color:transparent}
    .main{flex-direction:column}
    .content{padding:16px}
  }
</style>
</head>
<body>

<header>
  <h1>高中英语语法切片课堂</h1>
  <p>3 Level · 180 节 · 每节含课前测 + 逐字稿 + 随堂练习</p>
</header>

<div class="progress-bar-wrap">
  <div class="prog-row" id="progRow"></div>
</div>

<div class="main">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="content" id="content"></div>
</div>

<script>
fetch('data.json').then(r=>r.json()).then(data=>{
  const sidebar=document.getElementById('sidebar')
  const content=document.getElementById('content')
  const progRow=document.getElementById('progRow')

  // 文件映射
  const files={
    "总大纲":{name:"总大纲(3Level×60节).xlsx",label:"总大纲 Excel",icon:"📊",type:"outline"},
    "L1-01":{name:"Level1/高中英语语法切片-Level1-第01课-词类总览.docx",label:"下载逐字稿",icon:"📄",type:"docx"}
  }

  function fileLink(path,label,icon,cls){
    return `<a class="dl-chip" href="docs/${path}" download>${icon} ${label}</a>`
  }

  // 进度
  data.forEach(lv=>{
    const done=lv.lessons.filter(l=>l.done).length
    const pct=Math.round(done/lv.lessons.length*100)
    const colors=["#1a3a6b","#2e6da4","#5b8dd9"]
    const ci=data.indexOf(lv)
    progRow.innerHTML+=`
    <div class="prog-item">
      <div class="prog-label">${lv.name}</div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${colors[ci]}"></div></div>
      <div class="prog-count">${done}/${lv.lessons.length} 节已完成</div>
    </div>`
  })

  // Tab + 面板
  data.forEach((lv,li)=>{
    const tab=document.createElement('button')
    tab.className='tab-btn'+(li===0?' active':'')
    tab.dataset.idx=li
    tab.innerHTML=`${lv.name}<span class="tab-badge">${lv.lessons.length}</span>`
    tab.onclick=()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'))
      document.querySelectorAll('.level-panel').forEach(p=>p.classList.remove('active'))
      tab.classList.add('active')
      document.getElementById('panel-'+li).classList.add('active')
    }
    sidebar.appendChild(tab)

    // 面板
    const panel=document.createElement('div')
    panel.className='level-panel'+(li===0?' active':'')
    panel.id='panel-'+li

    // 下载区
    let dlHtml=`<div class="dl-row">
      <a class="dl-btn outline" href="docs/高中英语语法切片-总大纲(3Level×60节).xlsx" download>
        <span class="dl-icon">📊</span>总大纲 Excel
      </a>`
    if(li===0){
      dlHtml+=`<a class="dl-btn solid" href="docs/Level1/高中英语语法切片-Level1-第01课-词类总览.docx" download>
        <span class="dl-icon">📄</span>第01课逐字稿 Word
      </a>`
    }
    dlHtml+=`</div>`

    // 按模块分组
    const mods={}
    lv.lessons.forEach(l=>{
      const key=l.big+'__'+l.mod
      if(!mods[key])mods[key]={big:l.big,mod:l.mod,items:[]}
      mods[key].items.push(l)
    })

    let modsHtml=''
    Object.values(mods).forEach(m=>{
      let cardsHtml=m.items.map(l=>{
        const chips=l.done
          ? `<span class="chip done-chip">✓ 已完成</span>
             ${li===0&&l.no===1?`<a class="dl-chip" href="docs/Level1/高中英语语法切片-Level1-第01课-词类总览.docx" download>📄 逐字稿</a>`:''}`
          : `<span class="chip">待完成</span>`
        return `<div class="card${l.done?' done':''}">
          <div class="card-no">${String(l.no).padStart(2,'0')}</div>
          <div class="card-body">
            <div class="card-title">${l.title}</div>
            <div class="card-meta">${chips}</div>
          </div>
        </div>`
      }).join('')
      modsHtml+=`<div class="mod-group">
        <div class="mod-header">
          <span class="mod-tag">${m.big}</span>
          <span class="mod-name">${m.mod}</span>
        </div>
        <div class="card-grid">${cardsHtml}</div>
      </div>`
    })

    panel.innerHTML=`
      <div class="level-head">
        <h2>${lv.name}</h2>
        <p>${lv.desc}</p>
      </div>
      ${dlHtml}
      ${modsHtml}`
    content.appendChild(panel)
  })
})
</script>
</body>
</html>
